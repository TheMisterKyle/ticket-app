name: Release Windows Companion

on:
  push:
    branches: [master]
    paths:
      - desktop-companion/style-app.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-app-style-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      STYLE_APP_PATH: desktop-companion/style-app.json
      PROJECT_PATH: desktop-companion/TicketToss.Companion.csproj
      PUBLISH_DIR: companion-publish
      ARTIFACT_NAME: Ticket-Toss-Projector-Windows.zip
      EXPECTED_APP_ID: ca.kyle.ticket-toss
      EXPECTED_DISPLAY_NAME: Ticket App
      EXPECTED_CHANNEL: stable
      EXPECTED_REPOSITORY: https://github.com/TheMisterKyle/ticket-app
      EXPECTED_ENTRYPOINT: TicketToss.Companion.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate release signal and identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $style = Get-Content $env:STYLE_APP_PATH -Raw | ConvertFrom-Json

          if ($style.schema_version -ne "1.0") { throw "Unsupported Style app schema_version: $($style.schema_version)" }
          if ($style.app_id -ne $env:EXPECTED_APP_ID) { throw "Unexpected app_id: $($style.app_id)" }
          if ($style.display_name -ne $env:EXPECTED_DISPLAY_NAME) { throw "Unexpected display_name: $($style.display_name)" }
          if ($style.channel -ne $env:EXPECTED_CHANNEL) { throw "Unexpected channel: $($style.channel)" }
          if ($style.runtime.platform -ne "windows" -or $style.runtime.architecture -ne "x64") { throw "Unexpected runtime target." }
          if ($style.installation.kind -ne "portable" -or $style.installation.entrypoint -ne $env:EXPECTED_ENTRYPOINT) { throw "Unexpected installation contract." }
          if ($style.data_strategy.migration_owner -ne "application") { throw "Unexpected migration owner." }
          if ($style.data_strategy.locations.Count -ne 1 -or $style.data_strategy.locations[0] -ne "%LOCALAPPDATA%/TicketToss") { throw "Unexpected persistent-data location." }
          if ($style.capabilities.style_managed -ne $true -or $style.capabilities.self_update -ne $false) { throw "Style lifecycle ownership is not preserved." }

          $version = [string]$style.version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }

          [xml]$project = Get-Content $env:PROJECT_PATH -Raw
          $versionNode = $project.SelectSingleNode("/Project/PropertyGroup/Version")
          if ($null -eq $versionNode) { throw "The desktop project has no canonical Version element." }
          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $version) { throw "Project version $projectVersion does not match Style version $version." }

          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; versions and release artifacts are immutable." }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete consumer runtime
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:RELEASE_VERSION -o $env:PUBLISH_DIR
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Enforce package boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entrypoint = Join-Path $env:PUBLISH_DIR $env:EXPECTED_ENTRYPOINT
          $runtimeManifest = Join-Path $env:PUBLISH_DIR "style-app.json"
          if (-not (Test-Path $entrypoint -PathType Leaf)) { throw "Packaged entrypoint is missing." }
          if (-not (Test-Path $runtimeManifest -PathType Leaf)) { throw "Packaged Style app manifest is missing." }

          $forbidden = Get-ChildItem $env:PUBLISH_DIR -Recurse -Force | Where-Object {
            $_.FullName -match '([\\/])(bin|obj|\.git|\.idea|campaigns|user-data|userdata|data)([\\/]|$)' -or
            $_.Extension -in @(".pdb", ".cs", ".xaml", ".user", ".suo")
          }
          if ($forbidden) {
            $paths = ($forbidden.FullName -join [Environment]::NewLine)
            throw "Forbidden development or mutable data found in consumer package:$([Environment]::NewLine)$paths"
          }

          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $env:ARTIFACT_NAME
          if (-not (Test-Path $env:ARTIFACT_NAME -PathType Leaf)) { throw "Consumer artifact was not created." }

      - name: Generate and validate approved Style release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (Get-FileHash $env:ARTIFACT_NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $env:ARTIFACT_NAME).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG/$env:ARTIFACT_NAME"

          $manifest = @{
            schema_version = "1.0"
            app_id = $env:EXPECTED_APP_ID
            version = $env:RELEASE_VERSION
            channel = $env:EXPECTED_CHANNEL
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            approved = $true
            minimum_contract_version = "1.0"
            source = @{
              repository = $env:EXPECTED_REPOSITORY
              commit = "${{ github.sha }}"
            }
            artifacts = @(@{
              platform = "windows"
              architecture = "x64"
              url = $url
              sha256 = $sha
              size_bytes = $size
              install_mode = "replace-directory"
              entrypoint = $env:EXPECTED_ENTRYPOINT
            })
            migration = @{ required = $false; owner = "application" }
            rollback = @{ supported = $true; strategy = "previous-artifact" }
            notes = "Style-managed Ticket App release $env:RELEASE_VERSION."
          }

          $manifest | ConvertTo-Json -Depth 8 | Set-Content style-release.json -Encoding utf8
          $check = Get-Content style-release.json -Raw | ConvertFrom-Json
          if ($check.approved -ne $true) { throw "Release is not approved." }
          if ($check.app_id -ne $env:EXPECTED_APP_ID -or $check.version -ne $env:RELEASE_VERSION -or $check.channel -ne $env:EXPECTED_CHANNEL) { throw "Release identity or version mismatch." }
          if ($check.source.repository -ne $env:EXPECTED_REPOSITORY -or $check.source.commit -notmatch '^[a-f0-9]{40}$' -or $check.source.commit -ne "${{ github.sha }}") { throw "Invalid source provenance." }
          if ($check.artifacts.Count -ne 1) { throw "Expected exactly one consumer artifact." }
          $artifact = $check.artifacts[0]
          if ($artifact.url -ne $url -or $artifact.sha256 -ne $sha -or [int64]$artifact.size_bytes -ne $size) { throw "Artifact metadata does not match the immutable ZIP." }
          if ($artifact.entrypoint -ne $env:EXPECTED_ENTRYPOINT -or $artifact.install_mode -ne "replace-directory") { throw "Installation metadata mismatch." }

      - name: Publish artifact and manifest together
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" "$env:ARTIFACT_NAME" style-release.json --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Ticket App $env:RELEASE_TAG" --notes "Style-managed Ticket App release $env:RELEASE_VERSION."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ticket-Toss-Projector-Windows-${{ env.RELEASE_VERSION }}
          path: |
            Ticket-Toss-Projector-Windows.zip
            style-release.json
          if-no-files-found: error
