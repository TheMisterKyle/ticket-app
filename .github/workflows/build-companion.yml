name: Build Windows Companion
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["desktop-companion/**", ".github/workflows/build-companion.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish standalone companion
        run: dotnet publish desktop-companion/TicketToss.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o companion-publish
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path companion-publish/* -DestinationPath Ticket-Toss-Projector-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Ticket-Toss-Projector-Windows
          path: Ticket-Toss-Projector-Windows.zip
          if-no-files-found: error
      - name: Create approved Style release manifest
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[style-release]')
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.0" }
          $releaseTag = "v$version"
          $asset = "Ticket-Toss-Projector-Windows.zip"
          $sha = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $asset).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/$releaseTag/$asset"
          $manifest = @{
            schema_version = "1.0"; app_id = "ca.kyle.ticket-toss"; version = $version
            channel = "stable"; published_at = (Get-Date).ToUniversalTime().ToString("o")
            approved = $true; minimum_contract_version = "1.0"
            artifacts = @(@{ platform = "windows"; architecture = "x64"; url = $url; sha256 = $sha; size_bytes = $size; install_mode = "replace-directory"; entrypoint = "TicketToss.Companion.exe" })
            migration = @{ required = $false; owner = "application" }
            rollback = @{ supported = $true; strategy = "previous-artifact" }
            notes = "First Style-managed Ticket App release."
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content style-release.json
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[style-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          gh release create "$tag" Ticket-Toss-Projector-Windows.zip style-release.json --target "$env:GITHUB_SHA" --title "Ticket App $tag" --notes "First Style-managed Ticket App release."
