name: Build Windows Companion

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "desktop-companion/**"
      - ".github/workflows/build-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish standalone companion
        run: dotnet publish desktop-companion/TicketToss.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o companion-publish

      - name: Upload ready-to-run companion
        uses: actions/upload-artifact@v4
        with:
          name: Ticket-Toss-Projector-Windows
          path: companion-publish/**
          if-no-files-found: error
