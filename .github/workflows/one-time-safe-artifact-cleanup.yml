name: One-time safe artifact cleanup
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-safe-artifact-cleanup.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: one-time-safe-artifact-cleanup
  cancel-in-progress: false
jobs:
  delete-approved-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete explicitly approved artifact IDs
        uses: actions/github-script@v8
        with:
          script: |
            const ids = [10329201476,10327934613,10323526131,10323616548,10054450140];
            let deleted = 0;
            for (const artifact_id of ids) {
              try {
                await github.request('DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id
                });
                deleted += 1;
                core.info(`Deleted artifact ${artifact_id}`);
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Artifact ${artifact_id} was already absent`);
                  continue;
                }
                throw error;
              }
            }
            core.info(`Deleted ${deleted} of ${ids.length} approved artifacts from ticket-app`);
