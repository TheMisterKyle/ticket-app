name: Actions governance policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check_actions_policy.py'
      - '.github/ACTIONS-GOVERNANCE.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check_actions_policy.py'
      - '.github/ACTIONS-GOVERNANCE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Actions governance
        run: python .github/scripts/check_actions_policy.py
