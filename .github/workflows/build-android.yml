name: Build Android Apps

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "wear/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    paths:
      - "app/**"
      - "wear/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test phone and watch apps
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :wear:assembleDebug :wear:testDebugUnitTest
      - name: Upload watch debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Ticket-Toss-Wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

          retention-days: 3